# Photos de la page « Photos », dans l'ordre d'affichage.
#
# 1. Déposez l'image dans assets/img/photos/
#    (idéalement réduite à ~2000 px de large, pour que la page reste rapide).
#    Attention aux majuscules : « Bergen1.jpg » et « bergen1.jpg » sont deux noms
#    différents pour GitHub Pages.
# 2. Ajoutez une entrée ci-dessous :
#      ville  : le nom de la ville (ou du lieu). S'il change selon la langue,
#               écrivez { fr: "Copenhague", en: "Copenhagen" }.
#      pays   : code ISO à 2 lettres, ENTRE GUILLEMETS (ex. "NO", "CA") ;
#               les codes sont listés dans _data/noms_pays.yml.
#      annee  : l'année de la photo.
#      rangee : (facultatif) les photos CONSÉCUTIVES qui ont la même valeur de rangee
#               sont placées sur la même ligne, à la même hauteur, sur toute la largeur.
#               Une photo seule dans sa rangée occupe toute la largeur.
#               Sans rangee, les photos sont regroupées par 3 (réglable avec
#               photos_par_ligne dans _config.yml).
#      colonne: (facultatif) dans une rangée, les photos CONSÉCUTIVES qui ont la même
#               valeur de colonne sont EMPILÉES. Toutes les colonnes d'une rangée ont la
#               même hauteur : une grande photo à gauche peut faire face à deux photos
#               empilées à droite. Sans colonne, chaque photo forme sa propre colonne.
#
#      section     : (facultatif) titre de section ; remplace le pays comme titre.
#      sous_section: (facultatif) titre de sous-section ; remplace la ville comme sous-titre.
#                    Texte simple, ou { fr: "...", en: "..." } pour traduire.
#                    Ex. section: { fr: "Échange à Bergen", en: "Exchange in Bergen" }
#                        sous_section: { fr: "Randonnées", en: "Hikes" }
#                    Les filtres (pays, ville, année) continuent d'utiliser pays et ville.
#
#    ORDRE ET AGENCEMENT : la page est organisée en sections (par défaut le pays) puis en
#    sous-sections (par défaut la ville), dans l'ordre où elles apparaissent ici ;
#    les photos suivent l'ordre du fichier.
#    Déplacez les entrées pour changer l'ordre ; utilisez rangee pour l'agencement.
#    Exemple : une grande photo à gauche, deux photos empilées à droite,
#    puis trois photos côte à côte :
#      Bergen1 : rangee: 1, colonne: 1
#      Bergen2 : rangee: 1, colonne: 2
#      Bergen3 : rangee: 1, colonne: 2
#      Bergen4 : rangee: 2      Bergen5 : rangee: 2      Bergen6 : rangee: 2
#    Ville, pays et année alimentent aussi les filtres de la page et la légende automatique
#    « Ville, Pays, Année » (lue par les lecteurs d'écran). Pour afficher une légende sous la photo :
#      legende:
#        fr: "..."
#        en: "..."
#


