bio: |
  Je suis étudiant à la maitrise en informatique à l'Université de Montréal, membre du Cirrelt et du Mila.
  Je travaille sur la théorie des jeux et du vote, plus précisément les liens entre le vote par approbation
  à plusieurs gagnants (*approval-based multiwinner voting*) et les jeux budgétés (*budgeted games*), les équilibres
  et les algorithmes.

interets_perso: |
  À côté de mes algorithmes, vous me trouverez souvent en train de répondre à des questions de Génie en herbe
  ou de marcher en nature. Je suis aussi un amateur de hockey et de ses statistiques.
  J'adore aussi voyager, découvrir la richesse des cultures et de la nature.
  Vous pouvez trouver certains de mes clichés [ici](/photos).

  Je m'implique aussi sur mon temps libre pour des causes en lesquelles je crois. Actuellement : 
    - Sur le conseil d'administration du Mouvement provincial de Génie en herbe / Panthologie (mpghp) pour valoriser
    la connaissance en général et offrir à des milliers de jeunes au primaire et secondaire une activité parascolaire
    motivante.
    - Sur le Commité exécutif des jeunes du parti québécois pour défendre un Québec plus juste, soucieux de sa population
    et de son environnement et libre. Comme conseiller aux affaires internes, je m'occupe du secrétariat, des statuts et
    règlements et du suivi de nos objectifs.

