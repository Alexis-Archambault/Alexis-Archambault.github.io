bio: |
  I am a master's student in computer science at the University of Montreal, a member of Cirrelt and Mila.
  I work on game theory and voting theory, more specifically the links between *approval-based multiwinner 
  voting* and *budgeted games*, the equilibria and algorithms.

interets_perso: |
  Alongside my algorithms, you'll often find me at quizzes or walking in nature.
  I also love traveling, discovering the richness of cultures and nature. You 
  can find some of my photos [here](/en/photos).


  I also get involved in my free time for causes I believe in. Now: 
    - On the board of directors of the *Mouvement provincial de Génie en herbe / Panthologie* (mpghp), the main organisation
    for general knowledge quizzes competition in primary and secondary schools in Québec, to promote knowledge 
    in general and offer thousands of young people in primary and secondary school a motivating extracurricular activity.
    - On the Executive Committee of the Youth of the Parti Québécois to defend a fairer Québec, concerned 
    for its people and its environment and a free Québec. As an internal affairs advisor, I handle the secretariat, status, 
    and regulation and monitoring of our objectives.

